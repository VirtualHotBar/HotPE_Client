[install]
# 使用 npm 注册表
registry = "https://registry.npmjs.org/"
# 启用缓存
cache = true
# 自动安装 peer dependencies
auto = true

[install.scopes]
# 可以为特定作用域配置不同的注册表

[run]
# 启用 bun shell
shell = "bun"
# 设置并发任务数
concurrent = 4

[test]
# 测试超时时间
timeout = 5000
# 启用覆盖率
coverage = false

[build]
# 构建目标
target = "node"
# 启用压缩
minify = true
# 启用 source maps
sourcemap = true